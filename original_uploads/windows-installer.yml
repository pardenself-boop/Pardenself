name: Build TOOLBOXX Windows Installer
on:
  workflow_dispatch:
jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Compile DAW and installer
        shell: pwsh
        run: ./build_windows.ps1
      - name: Verify installer output
        shell: pwsh
        run: |
          if (!(Test-Path dist/BOOM_BAP_TOOLBOXX_Setup_027.exe)) { throw "Missing installer" }
          Get-Item dist/BOOM_BAP_TOOLBOXX_Setup_027.exe | Select-Object Name,Length
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BOOM_BAP_TOOLBOXX_Setup_027
          path: dist/BOOM_BAP_TOOLBOXX_Setup_027.exe
          if-no-files-found: error
