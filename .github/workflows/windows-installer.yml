name: Build TOOLBOXX Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 -y --no-progress
      - name: Test, package, verify startup and compile installer
        shell: pwsh
        run: ./BUILD_SETUP_WINDOWS.ps1 -NoOpen
      - name: Verify installation, startup and removal
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Get-Content release.json -Raw | ConvertFrom-Json
          $installer = Join-Path $PWD ('dist/' + $release.installer)
          $installDir = Join-Path $env:RUNNER_TEMP 'TOOLBOXX-install-check'
          $installLog = Join-Path $PWD 'BUILD_INSTALL_LOG.txt'
          $installArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', ('/DIR="' + $installDir + '"'), ('/LOG="' + $installLog + '"'))
          $setup = Start-Process -FilePath $installer -ArgumentList $installArgs -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $installedExe = Join-Path $installDir ($release.executable + '.exe')
          if (!(Test-Path $installedExe)) { throw 'Installed executable missing' }
          $smoke = Start-Process -FilePath $installedExe -ArgumentList '--smoke-test' -PassThru
          if (!$smoke.WaitForExit(60000)) { $smoke.Kill(); throw 'Installed app startup timed out' }
          if ($smoke.ExitCode -ne 0) { throw 'Installed app startup failed' }
          & ./.builder-venv/Scripts/python.exe ./verify_windows_launch.py --exe $installedExe --screenshot validation/windows-installed-ui.png
          if ($LASTEXITCODE -ne 0) { throw 'Normal installed workspace launch failed' }
          $uninstaller = Join-Path $installDir 'unins000.exe'
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall check failed' }
          "installer=dist/$($release.installer)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Upload single installer
        uses: actions/upload-artifact@v4
        with:
          name: TOOLBOXX-Windows-installer
          path: ${{ steps.release.outputs.installer }}
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TOOLBOXX-build-diagnostics
          path: |
            BUILD_*_LOG.txt
            BUILD_DEPENDENCIES.txt
            validation/windows-installed-ui.png
          if-no-files-found: warn

  release:
    needs: package
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TOOLBOXX-Windows-installer
          path: release-artifact
      - name: Publish single development installer after all Windows checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess
          release=json.loads(Path('release.json').read_text())
          files=list(Path('release-artifact').iterdir())
          assert [p.name for p in files]==[release['installer']], 'Expected one Setup.exe'
          data=files[0].read_bytes()
          assert data[:2]==b'MZ'
          digest=hashlib.sha256(data).hexdigest()
          notes=Path('RELEASE_NOTES.md').read_text() if Path('RELEASE_NOTES.md').exists() else 'Windows development installer.'
          notes+=chr(10)*2+'Windows installer build, installation, startup and uninstallation checks passed.'+chr(10)*2+'SHA256: `'+digest+'`'+chr(10)
          notes+=chr(10)+'Build: https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']+chr(10)
          Path('release-notes.txt').write_text(notes)
          tag='build-'+release['build']
          existing=subprocess.run(['gh','release','view',tag],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          if existing.returncode==0:
              print('Existing release preserved:',tag)
          else:
              subprocess.run(['gh','release','create',tag,str(files[0]),'--target',os.environ['GITHUB_SHA'],'--title','TOOLBOXX Build '+release['build']+' - Windows installer','--notes-file','release-notes.txt','--prerelease'],check=True)
          PY
